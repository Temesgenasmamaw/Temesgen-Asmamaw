name: mobile_wallet
description: "Safaricom M-Pesa mobile banking application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^2.5.0

  # Networking
  dio: ^5.11.1

  # Routing
  go_router: ^14.8.1

  # Serialization
  json_annotation: ^4.9.0

  # Utils
  intl: ^0.20.2
  iconsax: ^0.0.8

  # Environment
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  json_serializable: ^6.9.4

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env
    - .env.example
